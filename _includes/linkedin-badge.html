<span class="linkedin-badge-container">
  <div class="badge-base LI-profile-badge" 
       data-locale="en_US" 
       data-size="large" 
       data-type="HORIZONTAL" 
       data-vanity="almill36" 
       data-version="v1">
    <a class="badge-base__link LI-simple-link" 
       href="https://bs.linkedin.com/in/almill36?trk=profile-badge">
       Alejandro M.
    </a>
  </div>
</span>

<script>
  (function() {
    var container = document.currentScript.parentElement;
    var badgeDiv = container.querySelector('.LI-profile-badge');
    if (!badgeDiv) return;
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    badgeDiv.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  })();
</script>
